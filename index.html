        let anoSelecionado = "9º Ano";

        document.addEventListener("DOMContentLoaded", () => {
            resetaPainel();
            renderizarHabilidades();
        });

        function selecionarAno(ano) {
            anoSelecionado = ano;
            document.getElementById("labelAnoAtual").innerText = ano;
            
            document.querySelectorAll(".btn-ano").forEach(btn => {
                btn.className = "btn-ano px-5 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white";
            });

            const idBtn = `btn-${ano.replace('º ', '').toLowerCase()}`;
            const btn = document.getElementById(idBtn);
            if(btn) btn.className = "btn-ano px-5 py-2 text-xs font-bold rounded-lg transition text-white bg-indigo-600 shadow-md";

            resetaPainel();
            renderizarHabilidades();
        }

        function renderizarHabilidades() {
            const ciclo = document.getElementById("filtroCiclo").value;
            const unidade = document.getElementById("filtroUnidade").value;
            const container = document.getElementById("containerListaHabilidades");

            const filtradas = bancoHabilidades.filter(item => {
                const mAno = item.ano === anoSelecionado;
                const mCiclo = ciclo === "Todos os Ciclos" || item.ciclos.includes(ciclo);
                const mUnidade = unidade === "Todas as Unidades" || item.ut === unidade;
                return mAno && mCiclo && mUnidade;
            });

            document.getElementById("contadorHabilidades").innerText = filtradas.length;
            container.innerHTML = "";

            if (filtradas.length === 0) {
                container.innerHTML = `
                    <div class="p-4 bg-[#0e1322] border border-slate-800/80 rounded-xl text-center">
                        <p class="text-xs text-slate-400">Nenhuma habilidade encontrada para os filtros selecionados no <strong>${anoSelecionado}</strong>.</p>
                    </div>`;
                return;
            }

            filtradas.forEach(hab => {
                const div = document.createElement("div");
                div.className = "p-4 bg-[#0e1322] border border-slate-800/80 hover:border-indigo-500/50 rounded-xl cursor-pointer transition flex flex-col gap-1.5";
                div.onclick = () => verDetalhes(hab);
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-black text-indigo-400 tracking-wider">${hab.codigo}</span>
                        <div class="flex gap-1">
                            ${hab.ciclos.map(c => `<span class="text-[9px] font-bold bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700">${c}</span>`).join('')}
                        </div>
                    </div>
                    <p class="text-xs text-slate-300 line-clamp-2 leading-relaxed">${hab.desc}</p>
                    <span class="text-[10px] text-slate-500 uppercase font-semibold">${hab.ut}</span>
                `;
                container.appendChild(div);
            });
        }

        // DETALHES DE UMA HABILIDADE SELECIONADA
        function verDetalhes(hab) {
            const painel = document.getElementById("painelDetalhes");
            painel.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-start border-b border-slate-800/80 pb-4">
                        <div>
                            <span class="text-xs font-bold text-indigo-400 uppercase tracking-widest">${hab.ano} • ${hab.ut}</span>
                            <h3 class="text-2xl font-black text-white mt-1">${hab.codigo}</h3>
                            <span class="text-xs text-slate-400 font-medium">BNCC: ${hab.bncc}</span>
                        </div>
                        <div class="flex gap-1.5">
                            ${hab.ciclos.map(c => `<span class="px-3 py-1 rounded-lg text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">${c}</span>`).join('')}
                        </div>
                    </div>

                    <div class="space-y-2">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Descrição da Habilidade CAEd</h4>
                        <p class="text-sm text-slate-200 leading-relaxed bg-[#070913] p-4 rounded-xl border border-slate-800/80">${hab.desc}</p>
                    </div>

                    <!-- DIRECIONAMENTO PEDAGÓGICO AO PROFESSOR -->
                    <div class="space-y-2">
                        <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-compass"></i> Direcionamento Pedagógico & Aplicação em Aula
                        </h4>
                        <div class="bg-amber-500/10 border border-amber-500/20 p-4 rounded-xl text-xs text-slate-200 leading-relaxed">
                            ${hab.direcao}
                        </div>
                    </div>
                </div>
            `;
        }

        // TELA INICIAL COM AS CAPAS E SUMÁRIOS
        function resetaPainel() {
            const livro = livrosDidaticos[anoSelecionado];
            const painel = document.getElementById("painelDetalhes");

            painel.innerHTML = `
                <div class="space-y-6">
                    <!-- CARTÃO DA CAPA DO LIVRO -->
                    <div class="p-6 rounded-2xl border ${livro.cor} flex flex-col sm:flex-row items-center gap-6 shadow-2xl">
                        <div class="w-24 h-32 bg-slate-800 rounded-xl border border-slate-700 flex flex-col justify-center items-center text-center p-2 shrink-0 shadow-lg">
                            <i class="fa-solid fa-book-open text-3xl text-indigo-400 mb-2"></i>
                            <span class="text-[9px] font-black uppercase text-slate-300">${anoSelecionado}</span>
                        </div>
                        <div class="space-y-1 text-center sm:text-left">
                            <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">Livro Didático Adotado</span>
                            <h3 class="text-lg font-black text-white">${livro.titulo}</h3>
                            <p class="text-xs text-slate-300"><strong>Autor:</strong> ${livro.autor} | <strong>Editora:</strong> ${livro.editora}</p>
                        </div>
                    </div>

                    <!-- SUMÁRIO DO LIVRO -->
                    <div class="space-y-3">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-list-ol"></i> Estrutura de Capítulos (${anoSelecionado})
                        </h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5 max-h-[280px] overflow-y-auto pr-1">
                            ${livro.capitulos.map(cap => `
                                <div class="p-3 bg-[#070913] border border-slate-800/80 rounded-xl text-xs text-slate-300 font-medium flex items-center gap-2">
                                    <i class="fa-solid fa-bookmark text-indigo-500 text-[10px]"></i>
                                    <span>${cap}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
