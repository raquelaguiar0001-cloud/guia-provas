  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();

      const gradeCards = {
        "6º Ano": document.getElementById("card-6"),
        "7º Ano": document.getElementById("card-7"),
        "8º Ano": document.getElementById("card-8"),
        "9º Ano": document.getElementById("card-9")
      };

      const panel = document.getElementById("selection-panel");
      const selectedOutput = document.getElementById("selected-grade-output");
      const backButton = document.querySelector(".back-button");

      function selectGrade(grade) {
        Object.values(gradeCards).forEach(function (card) {
          card.classList.remove("is-selected");
        });

        gradeCards[grade].classList.add("is-selected");
        selectedOutput.textContent = grade + " selecionado — pronto para acessar os mapeamentos pedagógicos.";
        panel.classList.add("is-visible");
        panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      document.querySelectorAll(".grade-trigger").forEach(function (button) {
        button.addEventListener("click", function () {
          selectGrade(button.dataset.grade);
        });
      });

      backButton.addEventListener("click", function () {
        Object.values(gradeCards).forEach(function (card) {
          card.classList.remove("is-selected");
        });
        panel.classList.remove("is-visible");
        document.getElementById("grades-title").scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  </script>
