<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIDADE ESCOLAR NATIVIDADE MARINHO - Norteador Pedagógico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- CABEÇALHO -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="p-3 bg-indigo-600/20 border border-indigo-500/30 rounded-xl text-indigo-400">
                    <i class="fa-solid fa-school text-xl"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg sm:text-xl tracking-tight text-white uppercase">UNIDADE ESCOLAR NATIVIDADE MARINHO</h1>
                    <p class="text-xs text-slate-400 font-medium">Norteador Pedagógico • Ciências da Natureza • CAEd 2026</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.location.reload()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold rounded-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-border-all"></i> Início / Turmas
                </button>
                <button onclick="abrirModalCadastro()" class="px-4 py-2 bg-amber-500/10 border border-amber-500/30 text-amber-400 hover:bg-amber-500/20 text-xs font-bold rounded-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus"></i> Cadastrar Habilidade
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- PAINEL DE FILTROS -->
        <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 backdrop-blur-md shadow-xl grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
            
            <!-- Seleção de Anos -->
            <div class="md:col-span-5 flex items-center gap-2 bg-slate-950/80 p-1.5 rounded-xl border border-slate-800">
                <button onclick="selecionarAno('6º Ano')" id="btn-6ano" class="btn-ano flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">6º Ano</button>
                <button onclick="selecionarAno('7º Ano')" id="btn-7ano" class="btn-ano flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">7º Ano</button>
                <button onclick="selecionarAno('8º Ano')" id="btn-8ano" class="btn-ano flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">8º Ano</button>
                <button onclick="selecionarAno('9º Ano')" id="btn-9ano" class="btn-ano flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white bg-indigo-600 text-white shadow-lg shadow-indigo-500/30">9º Ano</button>
            </div>

            <!-- Filtro de Ciclo CAEd -->
            <div class="md:col-span-3 space-y-1">
                <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Ciclo da Prova CAEd</label>
                <select id="filtroCiclo" onchange="renderizarHabilidades()" class="w-full bg-slate-950 border border-indigo-500/50 rounded-xl px-3 py-2 text-xs font-semibold text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                    <option value="Todos">Todos os Ciclos</option>
                    <option value="Ciclo I">Ciclo I</option>
                    <option value="Ciclo II">Ciclo II</option>
                    <option value="Ciclo III">Ciclo III</option>
                    <option value="Ciclo IV">Ciclo IV</option>
                </select>
            </div>

            <!-- Filtro de Unidade Temática -->
            <div class="md:col-span-4 space-y-1">
                <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Unidade Temática</label>
                <select id="filtroUnidade" onchange="renderizarHabilidades()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-semibold text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                    <option value="Todas as Unidades">Todas as Unidades</option>
                    <option value="Matéria e Energia">Matéria e Energia</option>
                    <option value="Vida e Evolução">Vida e Evolução</option>
                    <option value="Terra e Universo">Terra e Universo</option>
                </select>
            </div>
        </section>

        <!-- ÁREA DE EXIBIÇÃO DE HABILIDADES -->
        <section class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Lista Esquerda de Habilidades (Filtradas) -->
            <div class="lg:col-span-5 space-y-3">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">
                        Habilidades (<span id="labelAnoAtual">9º Ano</span>)
                    </h2>
                    <span id="contadorHabilidades" class="px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-xs font-bold">0</span>
                </div>

                <div id="containerListaHabilidades" class="space-y-2.5 max-h-[600px] overflow-y-auto pr-1 custom-scrollbar">
                    <!-- Cards de habilidades inseridos via JavaScript -->
                </div>
            </div>

            <!-- Painel Direito de Detalhes da Habilidade Selecionada -->
            <div class="lg:col-span-7 bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-md min-h-[400px] flex flex-col justify-center items-center text-center shadow-xl" id="painelDetalhes">
                <div class="max-w-md space-y-3">
                    <i class="fa-solid fa-layer-group text-4xl text-slate-700"></i>
                    <p class="text-sm font-medium text-slate-400">Nenhuma habilidade selecionada.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL DE CADASTRO DE HABILIDADE -->
    <div id="modalCadastro" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 space-y-5 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="font-bold text-white text-base">Cadastrar Nova Habilidade</h3>
                <button onclick="fecharModalCadastro()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="formCadastroHabilidade" onsubmit="salvarHabilidade(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Código (Ex: EF09CI01)</label>
                        <input type="text" id="cadCodigo" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Ano</label>
                        <select id="cadAno" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="6º Ano">6º Ano</option>
                            <option value="7º Ano">7º Ano</option>
                            <option value="8º Ano">8º Ano</option>
                            <option value="9º Ano" selected>9º Ano</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Ciclo CAEd</label>
                        <input type="text" id="cadCiclo" placeholder="Ex: Ciclo I, Ciclo II" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Unidade Temática</label>
                        <select id="cadUnidade" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="Matéria e Energia">Matéria e Energia</option>
                            <option value="Vida e Evolução">Vida e Evolução</option>
                            <option value="Terra e Universo">Terra e Universo</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Descrição da Habilidade</label>
                    <textarea id="cadDescricao" rows="4" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="fecharModalCadastro()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl transition">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition shadow-lg shadow-indigo-600/30">Salvar Habilidade</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LOGICA E SCRIPT JAVASCRIPT -->
    <script>
        // CONFIGURAÇÃO DO FIREBASE (Insira suas chaves caso ainda não configuradas)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJECT_ID.firebaseapp.com",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_PROJECT_ID.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // ESTADO GLOBAL DA APLICAÇÃO
        let todasHabilidades = [];
        let anoSelecionado = "9º Ano";
        let habilidadeAtivaId = null;

        // INICIALIZAÇÃO
        document.addEventListener("DOMContentLoaded", () => {
            carregarHabilidades();
        });

        // BUSCA TODOS OS REGISTROS DO BANCO DE DADOS
        async function carregarHabilidades() {
            try {
                // Tenta carregar do Firestore
                const snapshot = await db.collection("habilidades").get();
                todasHabilidades = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (e) {
                console.warn("Usando escuta em tempo real ou banco local.");
                db.collection("habilidades").onSnapshot(snapshot => {
                    todasHabilidades = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderizarHabilidades();
                });
            }
            renderizarHabilidades();
        }

        // SELEÇÃO DE ANO
        function selecionarAno(ano) {
            anoSelecionado = ano;
            document.getElementById("labelAnoAtual").innerText = ano;

            // Atualiza o estilo visual dos botões
            document.querySelectorAll(".btn-ano").forEach(btn => {
                btn.className = "btn-ano flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white";
            });

            const btnAtivo = document.getElementById(`btn-${ano.replace('º ', '').toLowerCase()}`);
            if (btnAtivo) {
                btnAtivo.className = "btn-ano flex-1 py-2 text-xs font-bold rounded-lg transition text-white bg-indigo-600 shadow-lg shadow-indigo-500/30";
            }

            renderizarHabilidades();
        }

        // FILTRAGEM INTELIGENTE (RESOLVE O PROBLEMA DAS HABILIDADES COMPARTILHADAS)
        function renderizarHabilidades() {
            const cicloSelecionado = document.getElementById("filtroCiclo").value;
            const unidadeSelecionada = document.getElementById("filtroUnidade").value;
            const container = document.getElementById("containerListaHabilidades");

            // FiltragemFlexível
            const habilidadesFiltradas = todasHabilidades.filter(item => {
                // 1. Filtro por Ano
                const matchAno = item.ano === anoSelecionado;

                // 2. Filtro por Ciclo (Verificação Flexível para 'Ciclo I, Ciclo II' ou Arrays)
                let matchCiclo = false;
                if (cicloSelecionado === "Todos") {
                    matchCiclo = true;
                } else if (Array.isArray(item.ciclo)) {
                    matchCiclo = item.ciclo.includes(cicloSelecionado);
                } else if (typeof item.ciclo === "string") {
                    matchCiclo = item.ciclo.toLowerCase().includes(cicloSelecionado.toLowerCase());
                }

                // 3. Filtro por Unidade Temática
                const matchUnidade = unidadeSelecionada === "Todas as Unidades" || item.unidadeTematica === unidadeSelecionada;

                return matchAno && matchCiclo && matchUnidade;
            });

            // Atualiza Contador
            document.getElementById("contadorHabilidades").innerText = habilidadesFiltradas.length;

            // Limpa Container
            container.innerHTML = "";

            if (habilidadesFiltradas.length === 0) {
                container.innerHTML = `
                    <div class="p-6 bg-slate-900/40 border border-slate-800/60 rounded-xl text-center space-y-2">
                        <p class="text-xs font-medium text-slate-400">Nenhuma habilidade encontrada para os filtros selecionados no <strong class="text-slate-200">${anoSelecionado}</strong>.</p>
                    </div>
                `;
                resetaPainelDetalhes();
                return;
            }

            // Renderiza Cards
            habilidadesFiltradas.forEach(hab => {
                const isSelected = hab.id === habilidadeAtivaId;
                const card = document.createElement("div");
                card.className = `p-4 rounded-xl border transition cursor-pointer flex flex-col gap-2 ${
                    isSelected 
                        ? 'bg-indigo-600/10 border-indigo-500/60 shadow-lg shadow-indigo-500/10' 
                        : 'bg-slate-900/40 border-slate-800/80 hover:border-slate-700 hover:bg-slate-900/80'
                }`;
                card.onclick = () => selecionarHabilidade(hab);

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-black text-indigo-400 tracking-wider">${hab.codigo}</span>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700">${hab.ciclo}</span>
                    </div>
                    <p class="text-xs text-slate-300 line-clamp-2 leading-relaxed">${hab.descricao}</p>
                    <div class="flex items-center gap-2 pt-1">
                        <span class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">${hab.unidadeTematica || 'Ciências'}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // SELEÇÃO E EXIBIÇÃO NO PAINEL DIREITO
        function selecionarHabilidade(hab) {
            habilidadeAtivaId = hab.id;
            renderizarHabilidades();

            const painel = document.getElementById("painelDetalhes");
            painel.className = "bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-md min-h-[400px] flex flex-col justify-between text-left shadow-xl";
            
            painel.innerHTML = `
                <div class="space-y-5">
                    <div class="flex items-start justify-between gap-4 border-b border-slate-800 pb-4">
                        <div>
                            <span class="text-xs font-bold text-indigo-400 uppercase tracking-widest">${hab.ano} • ${hab.unidadeTematica || 'Ciências'}</span>
                            <h3 class="text-2xl font-black text-white mt-1">${hab.codigo}</h3>
                        </div>
                        <span class="px-3 py-1 rounded-lg text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">${hab.ciclo}</span>
                    </div>

                    <div class="space-y-2">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Descrição da Habilidade</h4>
                        <p class="text-sm text-slate-200 leading-relaxed font-normal bg-slate-950/60 p-4 rounded-xl border border-slate-800/80">${hab.descricao}</p>
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-500">
                    <span>Norteador Pedagógico CAEd 2026</span>
                    <button onclick="deletarHabilidade('${hab.id}')" class="text-rose-400 hover:text-rose-300 font-semibold transition flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i> Excluir
                    </button>
                </div>
            `;
        }

        function resetaPainelDetalhes() {
            habilidadeAtivaId = null;
            const painel = document.getElementById("painelDetalhes");
            painel.className = "bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-md min-h-[400px] flex flex-col justify-center items-center text-center shadow-xl";
            painel.innerHTML = `
                <div class="max-w-md space-y-3">
                    <i class="fa-solid fa-layer-group text-4xl text-slate-700"></i>
                    <p class="text-sm font-medium text-slate-400">Nenhuma habilidade selecionada.</p>
                </div>
            `;
        }

        // SALVAR NOVA HABILIDADE NO FIREBASE
        async function salvarHabilidade(e) {
            e.preventDefault();
            const novaHab = {
                codigo: document.getElementById("cadCodigo").value.trim().toUpperCase(),
                ano: document.getElementById("cadAno").value,
                ciclo: document.getElementById("cadCiclo").value.trim(),
                unidadeTematica: document.getElementById("cadUnidade").value,
                descricao: document.getElementById("cadDescricao").value.trim(),
                criadoEm: new Date()
            };

            try {
                await db.collection("habilidades").add(novaHab);
                fecharModalCadastro();
                carregarHabilidades();
            } catch (err) {
                alert("Erro ao salvar habilidade no banco: " + err.message);
            }
        }

        // DELETAR HABILIDADE
        async function deletarHabilidade(id) {
            if (confirm("Tem certeza que deseja excluir esta habilidade?")) {
                try {
                    await db.collection("habilidades").doc(id).delete();
                    resetaPainelDetalhes();
                    carregarHabilidades();
                } catch (err) {
                    alert("Erro ao deletar: " + err.message);
                }
            }
        }

        // CONTROLE DO MODAL
        function abrirModalCadastro() {
            document.getElementById("modalCadastro").classList.remove("hidden");
        }
        function fecharModalCadastro() {
            document.getElementById("modalCadastro").classList.add("hidden");
            document.getElementById("formCadastroHabilidade").reset();
        }
    </script>
</body>
</html>
