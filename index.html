<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Ciências - Matriz CAEd e Livro Didático</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #f8f9fa;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.05);
            --accent-color: #0d6efd;
        }
        body {
            background-color: var(--primary-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .header-section {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
            border-bottom: 4px solid #084298;
        }
        .turma-card {
            border: none;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            box-shadow: var(--card-shadow);
        }
        .turma-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .ciclo-btn {
            font-weight: 600;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
        }
        .habilidade-card {
            border-left: 4px solid var(--accent-color);
            background: white;
            border-radius: 8px;
            margin-bottom: 1rem;
            box-shadow: var(--card-shadow);
        }
        .badge-code {
            font-size: 0.9rem;
            background-color: #e7f1ff;
            color: #0c63e4;
            border: 1px solid #b6d4fe;
        }
        .badge-bncc {
            font-size: 0.85rem;
            background-color: #f8f9fa;
            color: #495057;
            border: 1px solid #dee2e6;
        }
        .info-label {
            font-weight: 600;
            color: #495057;
        }
    </style>
</head>

    <header class="header-section">
        <div class="container text-center">
            <h1 class="fw-bold"><i class="fa-solid fa-book-open me-2"></i>Matriz de Referência e Livro Didático</h1>
            <p class="lead mb-0">Ciências da Natureza — Consulta Integrada por Turmas e Ciclos</p>
        </div>
    </header>

    <div class="container mb-5">
        
        <!-- TELA INICIAL: SELEÇÃO DE TURMAS -->
        <div id="tela-inicio">
            <h3 class="mb-4 text-center fw-bold text-secondary">Selecione a Turma</h3>
            <div class="row g-4">
                <div class="col-md-3">
                    <div class="card turma-card text-center p-4" onclick="selecionarTurma('6ano')">
                        <div class="card-body">
                            <i class="fa-solid fa-graduation-cap fa-3x text-primary mb-3"></i>
                            <h4 class="card-title fw-bold">6º Ano</h4>
                            <p class="card-text text-muted">32 Habilidades</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card turma-card text-center p-4" onclick="selecionarTurma('7ano')">
                        <div class="card-body">
                            <i class="fa-solid fa-graduation-cap fa-3x text-success mb-3"></i>
                            <h4 class="card-title fw-bold">7º Ano</h4>
                            <p class="card-text text-muted">34 Habilidades</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card turma-card text-center p-4" onclick="selecionarTurma('8ano')">
                        <div class="card-body">
                            <i class="fa-solid fa-graduation-cap fa-3x text-warning mb-3"></i>
                            <h4 class="card-title fw-bold">8º Ano</h4>
                            <p class="card-text text-muted">33 Habilidades</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card turma-card text-center p-4" onclick="selecionarTurma('9ano')">
                        <div class="card-body">

                            <h4 class="card-title fw-bold">9º Ano</h4>
                            <p class="card-text text-muted">34 Habilidades</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TELA DE DETALHES DA TURMA -->
        <div id="tela-detalhes" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <button class="btn btn-outline-secondary" onclick="voltarInicio()">
                    <i class="fa-solid fa-arrow-left me-2"></i>Voltar às Turmas
                </button>
                <h2 id="titulo-turma" class="fw-bold mb-0"></h2>
                <div></div>
            </div>

            <!-- NAVEGAÇÃO DE CICLOS -->
            <div class="d-flex justify-content-center gap-2 mb-4" id="botoes-ciclos">
                <button class="btn btn-outline-primary ciclo-btn active" id="btn-ciclo1" onclick="carregarCiclo(1)">

            </div>

            <!-- LISTA DE HABILIDADES -->
            <div id="lista-habilidades"></div>
        </div>

        let turmaAtual = null;
        let cicloAtual = 1;

        function selecionarTurma(turmaKey) {
            turmaAtual = turmaKey;
            cicloAtual = 1;

            document.getElementById('tela-inicio').style.display = 'none';
            document.getElementById('tela-detalhes').style.display = 'block';

            const dadosTurma = bancoDados[turmaKey];
            document.getElementById('titulo-turma').innerText = dadosTurma.titulo;

            document.getElementById('count-ciclo1').innerText = dadosTurma.ciclos[1].length;
            document.getElementById('count-ciclo2').innerText = dadosTurma.ciclos[2].length;
            document.getElementById('count-ciclo3').innerText = dadosTurma.ciclos[3].length;

            carregarCiclo(1);
        }

        function voltarInicio() {
            document.getElementById('tela-detalhes').style.display = 'none';
            document.getElementById('tela-inicio').style.display = 'block';
            turmaAtual = null;
        }

        function carregarCiclo(numCiclo) {
            cicloAtual = numCiclo;

            // Atualiza botões
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`btn-ciclo${i}`);
                if (i === numCiclo) {
                    btn.classList.add('active', 'btn-primary');
                    btn.classList.remove('btn-outline-primary');
                } else {
                    btn.classList.remove('active', 'btn-primary');
                    btn.classList.add('btn-outline-primary');
                }
            }

            const conteiner = document.getElementById('lista-habilidades');
            conteiner.innerHTML = '';

            const habilidades = bancoDados[turmaAtual].ciclos[numCiclo];

            if (!habilidades || habilidades.length === 0) {
                conteiner.innerHTML = '<div class="alert alert-info">Nenhuma habilidade cadastrada para este ciclo.</div>';
                return;
            }

            habilidades.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card habilidade-card p-3';
                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge badge-code fw-bold px-3 py-2"><i class="fa-solid fa-barcode me-1"></i>${item.codigo}</span>
                        <span class="badge badge-bncc"><i class="fa-solid fa-bookmark me-1"></i>BNCC: ${item.bncc}</span>
                    </div>
                    <div class="mb-3">
                        <span class="info-label text-primary">Habilidade e Descritor (Oficial CAEd):</span>
                        <p class="mb-0 fw-medium text-dark">${item.caed}</p>
                    </div>
                    <hr class="my-2 text-muted">
                    <div class="row g-2 text-secondary small">
                        <div class="col-md-4">
                            <i class="fa-solid fa-layer-group text-primary me-1"></i>
                            <span class="info-label">Unidade Temática:</span> ${item.ut}
                        </div>
                        <div class="col-md-4">
                            <i class="fa-solid fa-book text-primary me-1"></i>
                            <span class="info-label">Capítulo:</span> ${item.cap}
                        </div>
                        <div class="col-md-4">
                            <i class="fa-solid fa-file-lines text-primary me-1"></i>
                            <span class="info-label">Página:</span> ${item.pag}
                        </div>
                    </div>
                `;
                conteiner.appendChild(card);
            });
        }
    </script>
