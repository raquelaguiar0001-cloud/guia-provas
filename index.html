                        <option value="VE - Vida e Evolução">VE - Vida e Evolução</option>

                        Ano / Ciclo
                    </label>
                    <select id="filter-grade" class="w-full py-2.5 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">

                        <option value="8º Ano - Ciclo III" selected>8º Ano - Ciclo III</option>

        let selectedId = db[0].id;

        // Render List Items
        function renderList() {
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
            const unitVal = document.getElementById('filter-unit').value;

            const filtered = db.filter(item => {
                const matchSearch = searchVal === '' || 
                                    item.id.toLowerCase().includes(searchVal) ||
                                    item.bncc.toLowerCase().includes(searchVal) ||
                                    item.title.toLowerCase().includes(searchVal) ||
                                    item.description.toLowerCase().includes(searchVal);
                
                const matchUnit = unitVal === 'todos' || item.unit === unitVal;

                return matchSearch && matchUnit;
            });

            document.getElementById('results-count').innerText = filtered.length;
            const container = document.getElementById('skills-list');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-4 bg-white rounded-lg border border-slate-200 text-center text-slate-500 text-sm">Nenhuma habilidade do CAEd encontrada para essa busca.</div>`;
                document.getElementById('detail-card').innerHTML = `<div class="text-center text-slate-400 py-12">Selecione um código válido na lista ao lado.</div>`;
                return;
            }

            if (!filtered.some(i => i.id === selectedId)) {
                selectedId = filtered[0].id;
            }

            filtered.forEach(item => {
                const isActive = item.id === selectedId;
                const card = document.createElement('div');
                card.className = `p-3.5 rounded-lg border transition-all cursor-pointer ${
                    isActive 
                    ? 'bg-indigo-50 border-indigo-500 shadow-sm' 
                    : 'bg-white border-slate-200 hover:border-indigo-300 hover:bg-slate-50'
                }`;
                card.onclick = () => {
                    selectedId = item.id;
                    renderList();
                    renderDetail();
                };

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="font-bold text-xs px-2 py-0.5 rounded ${isActive ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'}">${item.id}</span>
                        <span class="text-xs font-semibold text-slate-500">${item.bncc}</span>
                    </div>
                    <h3 class="text-sm font-semibold text-slate-800 line-clamp-1">${item.title}</h3>
                    <p class="text-xs text-slate-500 mt-1 line-clamp-2">${item.description}</p>
                `;
                container.appendChild(card);
            });

            renderDetail();
        }

        // Render Detail Card
        function renderDetail() {
            const item = db.find(i => i.id === selectedId);
            const container = document.getElementById('detail-card');

            if (!item) return;

            container.innerHTML = `
                <!-- Top Info Bar -->
                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-4 mb-6">
                    <div class="flex items-center space-x-2">
                        <span class="bg-amber-100 text-amber-900 font-extrabold text-sm px-3 py-1 rounded-md border border-amber-200">
                            CÓDIGO CAEd: ${item.id}
                        </span>
                        <span class="bg-indigo-100 text-indigo-900 font-extrabold text-sm px-3 py-1 rounded-md border border-indigo-200">
                            BNCC: ${item.bncc}
                        </span>
                    </div>
                    <div class="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded">
                        ${item.unit}
                    </div>
                </div>

                <!-- Title & Description -->
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-slate-900 mb-2">${item.title}</h2>
                    <div class="bg-slate-50 p-3.5 rounded-lg border-l-4 border-indigo-500 text-sm text-slate-700">
                        <strong>Habilidade CAEd:</strong> ${item.description}
                    </div>
                </div>

                <!-- Grid Section: Focus & Pitfalls -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <!-- Target Objective -->
                    <div class="bg-emerald-50/60 border border-emerald-200 rounded-lg p-4">
                        <div class="flex items-center space-x-2 text-emerald-800 font-bold text-sm mb-2">
                            <i data-lucide="target" class="w-4 h-4"></i>
                            <span>Foco Primário no CAEd</span>
                        </div>
                        <p class="text-xs sm:text-sm text-emerald-950 leading-relaxed">${item.focus}</p>
                    </div>

                    <!-- Common Pitfalls -->
                    <div class="bg-rose-50/60 border border-rose-200 rounded-lg p-4">
                        <div class="flex items-center space-x-2 text-rose-800 font-bold text-sm mb-2">
                            <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                            <span>Distratores & Erros Frequentes</span>
                        </div>
                        <ul class="list-disc list-inside text-xs sm:text-sm text-rose-950 space-y-1">
                            ${item.pitfalls.map(p => `<li>${p}</li>`).join('')}
                        </ul>
                    </div>
                </div>

                <!-- Methodology / Teaching Route -->
                <div class="mb-6">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                        <i data-lucide="route" class="w-4 h-4 text-indigo-600"></i> Rota Didática Sugerida (OBSERVAR • DUVIDAR • TEORIZAR)
                    </h3>
                    <div class="space-y-2">
                        ${item.methodologyRoute.map(r => `
                            <div class="flex items-start space-x-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <span class="bg-indigo-600 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5">${r.step}</span>
                                <div class="text-xs sm:text-sm">
                                    <strong class="text-slate-800">${r.action}:</strong> 
                                    <span class="text-slate-600">${r.detail}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Prerequisites & Sample Tip -->
                <div class="bg-indigo-50/40 border border-indigo-100 rounded-lg p-4 mb-6">
                    <h4 class="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-2 flex items-center gap-1">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-indigo-600"></i> Pré-requisitos Fundamentais
                    </h4>
                    <ul class="list-disc list-inside text-xs sm:text-sm text-slate-700 space-y-1 mb-3">
                        ${item.prerequisites.map(req => `<li>${req}</li>`).join('')}
                    </ul>
                    <div class="pt-2 border-t border-indigo-100/80 text-xs text-indigo-900 italic">
                        <strong>Dica de Item de Prova:</strong> ${item.sampleQuestionTip}
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-wrap items-center justify-end gap-3 pt-4 border-t border-slate-100 no-print">
                    <button onclick="copyLessonPlan()" class="inline-flex items-center space-x-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-colors">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                        <span>Copiar para Plano de Aula</span>
                    </button>
                    <button onclick="window.print()" class="inline-flex items-center space-x-1.5 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">
                        <i data-lucide="printer" class="w-4 h-4"></i>
                        <span>Imprimir / Gerar PDF</span>
                    </button>
                </div>
            `;

            lucide.createIcons();
        }

        function copyLessonPlan() {
            const item = db.find(i => i.id === selectedId);
            if (!item) return;

            const text = `NORTEADOR PEDAGÓGICO - CAEd 2026
Código CAEd: ${item.id} | Habilidade BNCC: ${item.bncc}
Unidade Temática: ${item.unit}
Título: ${item.title}

HABILIDADE:
${item.description}

FOCO DA AVALIAÇÃO:
${item.focus}

DISTRATORES / ERROS FREQUENTES:
${item.pitfalls.map(p => '- ' + p).join('\n')}

ROTA DIDÁTICA (OBSERVAR • DUVIDAR • TEORIZAR):
${item.methodologyRoute.map(r => `${r.step}. ${r.action}: ${r.detail}`).join('\n')}
            `;

            navigator.clipboard.writeText(text).then(() => {
                alert('Estrutura do plano copiada com sucesso!');
            });
        }

        document.getElementById('search-input').addEventListener('input', renderList);
        document.getElementById('filter-unit').addEventListener('change', renderList);

        renderList();
    </script>
</body>
</html>
